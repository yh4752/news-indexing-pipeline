<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">현재 코드: 배치 내 저장 흐름</title><desc id="desc">기사 입력, 청크와 테스트용 벡터 생성, Elasticsearch 기사 저장, Qdrant 포인트 저장 순서.</desc><metadata>REC-001, REC-007: RECONSTRUCTED</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
<rect width="1200" height="260" rx="18" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif">
<text x="36" y="45" text-anchor="start" font-size="26" font-weight="600" fill="#0f172a">현재 코드: 배치 내 저장 흐름</text><path d="M 280 145 H 320" fill="none" stroke="#526580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 580 145 H 620" fill="none" stroke="#526580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 880 145 H 920" fill="none" stroke="#526580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="95" width="240" height="100" rx="14" fill="#f2edff" stroke="#b8a3e5" stroke-width="2"/><text x="160.0" y="153.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">기사 입력</text><rect x="340" y="95" width="240" height="100" rx="14" fill="#f2edff" stroke="#b8a3e5" stroke-width="2"/><text x="460.0" y="138.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">청크 생성</text><text x="460.0" y="168.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">테스트용 벡터</text><rect x="640" y="95" width="240" height="100" rx="14" fill="#eaf3ff" stroke="#88afe8" stroke-width="2"/><text x="760.0" y="138.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">ES 기사</text><text x="760.0" y="168.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">저장</text><rect x="940" y="95" width="240" height="100" rx="14" fill="#eaf3ff" stroke="#88afe8" stroke-width="2"/><text x="1060.0" y="138.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Qdrant point</text><text x="1060.0" y="168.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">저장</text><text x="36" y="232" text-anchor="start" font-size="18" font-weight="400" fill="#526580">Qdrant 저장 실패 시 완료된 ES 저장은 되돌리지 않습니다.</text></g></svg>
