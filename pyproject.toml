[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-rag-reconstruction"
version = "0.1.0"
description = "RECONSTRUCTED News RAG indexing core and storage adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch>=9.5,<10",
    "qdrant-client>=1.19,<2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/news_rag_reconstruction"]

[tool.uv]
# NumPy 2.5 stubs use Python 3.12 syntax; keep strict Python 3.11 checks working.
constraint-dependencies = ["numpy<2.5"]
